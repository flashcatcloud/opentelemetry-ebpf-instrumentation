apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: obi
nodes:
  - role: control-plane
    labels:
      cluster.x-k8s.io/cluster-name: obi-k8s-test-cluster
      # faking a multi-zone cluster
      topology.kubernetes.io/zone: control-plane-zone
    extraMounts:
      # configuration files that need to be mounted in the host
      - hostPath: ../../configs
        containerPath: /configs
      # testoutput folder to store coverage data
      - hostPath: ../../../../../testoutput
        containerPath: /testoutput
  - role: worker
    labels:
      # faking a multi-zone cluster
      topology.kubernetes.io/zone: server-zone
      cluster.x-k8s.io/cluster-name: obi-k8s-test-cluster
    extraMounts:
      # configuration files that need to be mounted in the host
      - hostPath: ../../configs
        containerPath: /configs
      # testoutput folder to store coverage data
      - hostPath: ../../../../../testoutput
        containerPath: /testoutput
  - role: worker
    labels:
      # faking a multi-zone cluster
      topology.kubernetes.io/zone: client-zone
      cluster.x-k8s.io/cluster-name: obi-k8s-test-cluster
      # otel collector / prom scraper needs to be placed here, due to port mappings
      deployment/zone: otel
    extraMounts:
      # configuration files that need to be mounted in the host
      - hostPath: ../../configs
        containerPath: /configs
      # testoutput folder to store coverage data
      - hostPath: ../../../../../testoutput
        containerPath: /testoutput
      # OBI semconv registry, mounted read-only into the weaver pod (pinned to
      # this `otel` zone node via nodeAffinity in 08-weaver-multi-node.yml)
      - hostPath: ../../../../../schemas/obi
        containerPath: /obi-registry
    # Kind passes -1 as port 0 to Docker, which allocates the host port.
    extraPortMappings:
      # to avoid having to do port-forwarding from the Go client (a bit cumbersome process),
      # we just make visible some container ports through host ports
      # containerPort must be the "hostPort" value that needs to be
      # exposed on each Pod container
      - containerPort: 8999
        hostPort: -1
        listenAddress: "127.0.0.1"
      - containerPort: 9090
        hostPort: -1
        listenAddress: "127.0.0.1"
      # weaver admin port (POST /stop from the test host)
      - containerPort: 4320
        hostPort: -1
        listenAddress: "127.0.0.1"
      # weavercol telemetry (dropped-export check at teardown)
      - containerPort: 8888
        hostPort: -1
        listenAddress: "127.0.0.1"
      # suite otelcol telemetry (first-hop dropped-export check)
      - containerPort: 8890
        hostPort: -1
        listenAddress: "127.0.0.1"
